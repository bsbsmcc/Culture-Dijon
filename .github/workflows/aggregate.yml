name: Aggregate ICS calendars — Dijon

# Quand le job tourne :
#   - automatiquement toutes les heures (cron)
#   - manuellement depuis l'onglet Actions de GitHub (workflow_dispatch)
#   - à chaque modif de la config sur la branche main
on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures, à h:00
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "calendars.yaml"
      - "aggregate.py"
      - "scrapers/**"
      - "requirements.txt"
      - ".github/workflows/aggregate.yml"
      - "docs/index.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        # Chaque scraper produit un fichier ICS dans docs/<lieu>.ics
        # qui sera ensuite consommé par l'aggregator via calendars.yaml
        run: |
          for s in scrapers/*.py; do
            echo "=== Running $s ==="
            python "$s" || echo "Scraper $s failed but we continue"
          done

      - name: Scraper outputs
        run: |
          echo "=== docs/ contents after scrapers ==="
          ls -la docs/ || echo "(empty)"
          echo "=== ICS event counts ==="
          for f in docs/*.ics; do
            count=$(grep -c "^BEGIN:VEVENT" "$f" 2>/dev/null || echo 0)
            echo "$f : $count events"
          done

      - name: Run aggregator
        run: python -u aggregate.py 2>&1

      - name: Check combined.ics
        run: |
          echo "=== combined.ics size ==="
          wc -c docs/combined.ics
          echo "=== VEVENT count ==="
          grep -c "^BEGIN:VEVENT" docs/combined.ics || echo "0 VEVENTs"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
