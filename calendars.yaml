# ====================================================================
# Configuration de l'agrégateur de calendriers ICS — Dijon Culture
# --------------------------------------------------------------------
# - "name"     : nom du calendrier combiné (visible dans Outlook)
# - "timezone" : fuseau horaire par défaut
# - "calendars": liste des sources. Pour chacune :
#     * name   : identifiant unique (stable — ne pas changer)
#     * prefix : (optionnel) préfixe ajouté au titre des événements
#     * url    : URL du flux ICS (https:// ou webcal://) OU chemin
#                local (ex. "docs/la-vapeur.ics") généré par un scraper
#
# ====================================================================

name: "Dijon Culture — Calendrier combiné"
timezone: "Europe/Paris"

calendars:

  # ================================================================
  # SOURCES SCRAPÉES — priorité haute
  # ================================================================

  - name: "la-vapeur"
    prefix: "VAPEUR"
    url: "docs/la-vapeur.ics"

  - name: "le-consortium"
    prefix: "CONSORTIUM"
    url: "docs/le-consortium.ics"

  - name: "tdb"
    prefix: "TDB"
    url: "docs/tdb.ics"

  - name: "la-minoterie"
    prefix: "MINOTERIE"
    url: "docs/la-minoterie.ics"

  - name: "grand-kursaal"
    prefix: "KURSAAL"
    url: "docs/grand-kursaal.ics"

  - name: "cinema-eldorado"
    prefix: "ELDORADO"
    url: "docs/cinema-eldorado.ics"

  - name: "frac-bourgogne"
    prefix: "FRAC"
    url: "docs/frac-bourgogne.ics"

  - name: "mba-dijon"
    prefix: "MBA"
    url: "docs/mba-dijon.ics"

  - name: "zutique"
    prefix: "ZUTIQUE"
    url: "docs/zutique.ics"

  - name: "golden-coast"
    prefix: "GOLDEN COAST"
    url: "docs/golden-coast.ics"

  - name: "la-karriere"
    prefix: "KARRIÈRE"
    url: "docs/la-karriere.ics"

  - name: "drac-bfc"
    prefix: "DRAC BFC"
    url: "docs/drac-bfc.ics"

  - name: "dri-dijon"
    prefix: "INTERNATIONAL"
    url: "docs/dri-dijon.ics"

  - name: "hautes-cotes"
    prefix: "HAUTES CÔTES"
    url: "docs/hautes-cotes.ics"

